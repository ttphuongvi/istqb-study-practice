<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn luyện ISTQB CTFL v4.0</title>
<meta name="description" content="Ôn luyện ISTQB CTFL v4.0 — Sample Exam A, B, C, D có dịch tiếng Việt, giải thích, sổ câu sai và ôn theo chương.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1 id="hTitle">🧪 Ôn luyện ISTQB CTFL v4.0</h1>
    <p id="hSub">Bấm 🔊 để nghe phát âm English (US) · Chọn đáp án để xem bản dịch &amp; giải thích</p>
  </header>

  <div class="tabgroup">
    <div class="glabel">Đề thi mẫu</div>
    <div class="tabs" id="tabsExam"></div>
  </div>
  <div class="tabgroup">
    <div class="glabel">Ôn tập</div>
    <div class="tabs" id="tabsStudy"></div>
  </div>

  <div class="modebar" id="modebar"></div>

  <div class="dash" id="dash">
    <div class="timerbox" id="timerBox">
      <span class="ico">⏱️</span>
      <div style="flex:1">
        <div class="tval" id="timerVal">60:00</div>
        <div class="tlab" id="timerLab">Thời gian còn lại (60 phút)</div>
      </div>
      <button class="tbtn" id="btnPause">⏸ Tạm dừng</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="v" id="sDone">0</div><div class="l">Đã làm</div></div>
      <div class="stat ok"><div class="v" id="sOk">0</div><div class="l">Đúng</div></div>
      <div class="stat bad"><div class="v" id="sBad">0</div><div class="l">Sai</div></div>
      <div class="stat acc"><div class="v" id="sAcc">0%</div><div class="l">Chính xác</div></div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="barlabel"><span id="barTxt">Tiến độ 0/40</span><span id="barPct">0%</span></div>

    <div class="filters" id="filters"></div>

    <div class="actions">
      <button class="btn primary" id="btnSubmit">📊 Nộp bài &amp; Xem đánh giá</button>
      <button class="btn ghost" id="btnReset">🔄 Làm lại</button>
    </div>
  </div>

  <div id="result"></div>
  <div id="list"></div>

  <footer id="foot">ISTQB® CTFL v4.0 Sample Exams · Web Speech API (English US)</footer>
</div>

<!-- Dữ liệu câu hỏi (mỗi đề một file) -->
<script src="data/lo-map.js"></script>
<script src="data/exam-a.js"></script>
<script src="data/exam-b.js"></script>
<script src="data/exam-c.js"></script>
<script src="data/exam-d.js"></script>
<script src="data/syllabus.js"></script>
<!-- Ứng dụng -->
<script src="js/app.js"></script>
</body>
</html>
